name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: PHP 8.4
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Axolotl-PM PHP
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e
        with:
          php-version: "8.4"
          install-path: "${{ runner.temp }}/axolotl-php"
          pm-version-major: "5"

      - name: Validate Composer configuration
        run: composer validate

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run tests
        run: composer test

      - name: Run PHPStan at maximum level
        run: composer analyse

  build:
    name: Build PHAR with DevTools v4.1.1
    needs: quality
    permissions:
      contents: read
    uses: AxolotlBucketLabs/DevTools/.github/workflows/build-plugin.yml@c2eb715205a9dcb485a4ecabd17512f32f24d5d7 # v4.1.1
    with:
      project: .
      php-version: "8.4"
      pm-version-major: "5"
      axolotl-ref: "5.51.2"
      phpstan: "max"
