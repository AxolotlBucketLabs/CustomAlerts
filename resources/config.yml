config-version: 1

# Vietnamese message samples use Bedrock § color codes. All overrides stay disabled by default.
messages:
  join:
    enabled: false
    hide: false
    format: "§8[§a+§8] §f{display_name} §7đã tham gia máy chủ"
  quit:
    enabled: false
    hide: false
    format: "§8[§c-§8] §f{display_name} §7đã rời máy chủ"
  chat:
    enabled: false
    hide: false
    format: "§8[§bCHAT§8] §f{display_name} §8» §7{message}"
  death:
    enabled: false
    broadcast: "§8[§cX§8] §f{player} §7đã gục ngã tại §f{world}"
    screen: "§cBạn đã gục ngã."
  kick:
    enabled: false
    broadcast: "§8[§e!§8] §f{display_name} §7đã bị ngắt kết nối"
    reason: "§cKết nối bị ngắt: §f{reason}"
    screen: "§cBạn đã bị ngắt khỏi máy chủ."
  login:
    enabled: false
    message: "§cKhông thể kết nối lúc này. §7Vui lòng thử lại sau."
  pre-login:
    server-full:
      enabled: false
      reason: "§cMáy chủ hiện đã đầy."
      screen: "§cMáy chủ hiện đã đầy. §7Vui lòng thử lại sau."
    whitelist:
      enabled: false
      reason: "§cBạn chưa được thêm vào danh sách cho phép."
      screen: "§cBạn chưa được thêm vào danh sách cho phép."
    banned:
      enabled: false
      reason: "§cBạn đã bị cấm khỏi máy chủ."
      screen: "§cBạn đã bị cấm khỏi máy chủ."

# Overrides for translation keys still present in outgoing TextPackets.
# Numeric placeholders refer to packet parameters: {0}, {1}, ...
packets:
  text:
    # "death.attack.generic": "§8[§cX§8] §f{0} §7đã gục ngã"
  # DisconnectPacket contains already-rendered text, so match the exact current server-language message.
  disconnect:
    # "You are banned from this server.": "§cBạn không thể tham gia máy chủ này."

# Full translations/vi_VN.ini is copied to plugin_data/CustomAlerts/translations on first start.
# Enable the pack to offer catalogued client-side keys from locale files to players.
# Inline translations below take precedence over values in those files.
resource-pack:
  enabled: false
  required: false
  translations: {}
